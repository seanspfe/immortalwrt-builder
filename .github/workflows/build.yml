name: Build firmware

# Manual only on purpose: nothing here runs by itself, a build costs hours of
# runner time. Pick a target in the "Run workflow" dialog.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Target to build
        required: true
        default: both
        type: choice
        options:
          - both
          - x86_64
          - gl-mt3000
      cargo_jobs:
        description: 'honk: parallel cargo jobs (lower uses less RAM)'
        required: false
        default: '2'
        type: string

run-name: >-
  Build ${{ inputs.target }} - ImmortalWrt v25.12.2 + honk v0.1.0-beta.4

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

env:
  # Pins. scripts/prepare-tree.sh verifies every checkout against the commit
  # here, so a moved tag fails the build instead of drifting silently.
  IMMORTALWRT_REPO: https://github.com/immortalwrt/immortalwrt.git
  IMMORTALWRT_TAG: v25.12.2
  IMMORTALWRT_COMMIT: 4fc16f2985a358bd43bb522e43f05395fcbd6ed5
  IMMORTALWRT_KERNEL: 6.12.103
  PACKAGES_REPO: https://github.com/daeuniverse/openwrt-packages.git
  PACKAGES_COMMIT: e48b222f239e2572244c8cf495fbce79b0da7528
  HONK_REPO: https://github.com/daeuniverse/honk.git
  HONK_TAG: v0.1.0-beta.4
  HONK_COMMIT: d3fb81f4d7155581f9d276936690dc9f60ef2b77
  VANTAGE_REPO: https://github.com/anothaDev/luci-theme-vantage.git
  VANTAGE_TAG: v1.0.14
  VANTAGE_COMMIT: cddbfb262b7a67a0d3762039e4af66fc0ac92000
  # Toolchains and bpf-linker as pinned by honk v0.1.0-beta.4
  # (rust-toolchain.toml, crates/honk-ebpf/rust-toolchain.toml, .github/ci/pins.env).
  RUST_STABLE: '1.99.1'
  RUST_NIGHTLY: nightly-2026-10-20
  BPF_LINKER_VERSION: 0.11.0
  BPF_LINKER_SHA256: 10f62ba9ab7e544d538370552660efcb4f1a19153d5752bbf0f6b51f3bada450
  DOONA_VERSION: 0.1.0-rc.4
  # The build tree lives inside the checkout so artifacts and logs stay together.
  SRC_ROOT: ${{ github.workspace }}/.src

defaults:
  run:
    shell: bash

jobs:
  # Turns the choice input into a matrix. A job-level `if` cannot read the
  # matrix, so the selection is done here instead.
  select:
    name: Select targets
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        run: |
          set -euo pipefail
          case "${{ inputs.target }}" in
            both)
              echo 'matrix={"include":[{"target":"x86_64"},{"target":"gl-mt3000"}]}' >> "$GITHUB_OUTPUT"
              ;;
            x86_64|gl-mt3000)
              echo "matrix={\"include\":[{\"target\":\"${{ inputs.target }}\"}]}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unknown target '${{ inputs.target }}'" >&2
              exit 1
              ;;
          esac

  build:
    name: ${{ matrix.target }}
    needs: select
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      HONK_CARGO_JOBS: ${{ inputs.cargo_jobs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner image carries ~14 GB of SDKs this build never touches; a
      # full ImmortalWrt tree with debug info and a Rust workspace needs the room.
      - name: Free disk space
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/az \
            /opt/microsoft \
            /usr/local/.ghcup \
            /home/linuxbrew
          sudo apt-get purge -y 'dotnet-*' 'ghc-*' 'google-chrome-*' 'google-cloud-sdk-*' 2>/dev/null || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          df -h /

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libclang-dev libelf-dev libncurses5-dev libncursesw5-dev \
            libssl-dev llvm pkg-config python3 python3-dev python3-distutils \
            python3-setuptools rsync time unzip wget zlib1g-dev zstd
          clang --version

      - name: Install pinned Rust toolchains
        run: |
          set -euxo pipefail
          rustup toolchain install "$RUST_STABLE" --profile minimal \
            --component rustfmt --component clippy \
            --target x86_64-unknown-linux-musl \
            --target aarch64-unknown-linux-musl
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal \
            --component rust-src --component llvm-tools \
            --target x86_64-unknown-linux-musl \
            --target aarch64-unknown-linux-musl
          # The default only matters outside a crate that pins its own toolchain;
          # RUSTUP_TOOLCHAIN stays unset so the rust-toolchain.toml files win.
          rustup default "$RUST_STABLE"
          rustc --version
          cargo --version
          rustup run "$RUST_NIGHTLY" rustc --version
          rustup target list --installed --toolchain "$RUST_STABLE"

      - name: Install pinned bpf-linker
        run: |
          set -euxo pipefail
          archive="$RUNNER_TEMP/bpf-linker.tar.zst"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/aya-rs/bpf-linker/releases/download/v${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          echo "${BPF_LINKER_SHA256}  ${archive}" | sha256sum -c -
          zstd -dc "$archive" | tar -xf - -C "$HOME/.cargo/bin"
          bpf-linker --version

      - name: Prepare ImmortalWrt tree
        run: ./scripts/prepare-tree.sh

      - name: Merge config
        working-directory: .src/immortalwrt
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/configs/${{ matrix.target }}.config" .config
          make defconfig
          ./scripts/diffconfig.sh > "$GITHUB_WORKSPACE/config-${{ matrix.target }}.diffconfig"
          wc -l "$GITHUB_WORKSPACE/config-${{ matrix.target }}.diffconfig"

      - name: Verify merged config
        run: |
          ./scripts/verify-config.sh "${{ matrix.target }}" "$SRC_ROOT/immortalwrt"

      - name: Download package sources
        working-directory: .src/immortalwrt
        run: |
          set -euo pipefail
          make download -j"$(nproc)" ||
            echo "::warning::some sources failed to download; the build step will retry them"

      - name: Build firmware
        working-directory: .src/immortalwrt
        run: |
          set -euo pipefail
          make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build-${{ matrix.target }}.log"

      - name: Verify image contents
        run: ./scripts/verify-manifest.sh "${{ matrix.target }}" "$SRC_ROOT/immortalwrt"

      - name: Collect images
        run: |
          set -euo pipefail
          mkdir -p "out/${{ matrix.target }}"
          find .src/immortalwrt/bin/targets -maxdepth 2 -type f \
            \( -name '*.img.gz' -o -name '*.bin' -o -name '*.manifest' \
               -o -name '*.buildinfo' -o -name 'sha256sums' -o -name 'profiles.json' \) \
            -exec cp {} "out/${{ matrix.target }}/" \;
          ls -lh "out/${{ matrix.target }}"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-${{ matrix.target }}
          path: out/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload config and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-25.12.2-${{ matrix.target }}-config-log
          path: |
            config-${{ matrix.target }}.diffconfig
            build-${{ matrix.target }}.log
          if-no-files-found: warn
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## ${{ matrix.target }}"
            echo
            echo "- ImmortalWrt v25.12.2 (\`$IMMORTALWRT_COMMIT\`), kernel $IMMORTALWRT_KERNEL"
            echo "- honk $HONK_TAG (\`$HONK_COMMIT\`), doona $DOONA_VERSION"
            echo "- openwrt-packages \`$PACKAGES_COMMIT\`, Vantage $VANTAGE_TAG (\`$VANTAGE_COMMIT\`)"
            echo "- Rust $RUST_STABLE + $RUST_NIGHTLY, bpf-linker $BPF_LINKER_VERSION"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -d "out/${{ matrix.target }}" ]; then
            {
              echo '```'
              ls -lh "out/${{ matrix.target }}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
